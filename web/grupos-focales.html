<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Grupos focales: Dependencia y Desempeño — Dashboard de seguimiento</title>
<script src="lib/chart.umd.min.js"></script>
<script src="lib/chartjs-plugin-datalabels.min.js"></script>
<script src="data-gf.js"></script>
<style>
  :root {
    --azul: #216686;
    --rojo: #CD4F4F;
    --gris: #A6A6A6;
    --naranja: #DC7528;
    --verde: #1D7D54;
    --muted: #808080;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f2f1ef; color: #000; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 14px; }

  .topbar {
    background: #4d4d4d; color: #fff; padding: 14px 18px;
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
  }
  .back {
    color: #fff; text-decoration: none; font-size: 22px; line-height: 1;
    background: #5e5e5e; border-radius: 50%; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .back:hover { background: var(--rojo); }
  .kpis { display: flex; flex-wrap: wrap; gap: 30px; flex: 1 1 auto; }
  .kpi { text-align: center; min-width: 86px; }
  .kpi .v { font-size: 34px; font-weight: bold; }
  .kpi .l { font-size: 11px; font-weight: bold; margin-top: 2px; color: #e3e3e3; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; flex: 0 1 auto; }
  .filter { display: flex; flex-direction: column; gap: 3px; }
  .filter label { font-size: 11px; font-weight: bold; color: #e3e3e3; }
  .filter select {
    font-family: Arial, sans-serif; font-size: 12px; padding: 5px 8px;
    border: 1px solid #9a9a9a; background: #fff; color: #000; min-width: 140px;
  }
  .updated { width: 100%; font-size: 10px; color: #c9c9c9; font-style: italic; text-align: right; }

  .section-bar {
    background: var(--rojo); color: #fff; text-align: center;
    font-size: 15px; font-weight: bold; padding: 7px; margin: 14px 0;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; }
    .kpis { justify-content: space-between; }
  }
  .card { background: #fff; padding: 18px 20px; border: 1px solid #e2e0dd; margin-bottom: 16px; }
  .card h3 { color: var(--azul); font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 12px; }
  .canvas-md { position: relative; height: 260px; }
  .canvas-donut { position: relative; height: 290px; }
  .dlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; margin-top: 10px; }
  .dlegend .item { display: flex; align-items: center; gap: 5px; font-size: 11px; }
  .dlegend .swatch { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .notes { font-size: 9.5px; font-style: italic; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .source { font-size: 10px; font-weight: bold; color: var(--muted); text-align: right; margin: 6px 0 20px; }
  .empty { text-align: center; color: var(--muted); font-style: italic; padding: 30px 0; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="index.html" title="Volver a la carátula">&#8592;</a>
    <div class="kpis">
      <div class="kpi"><div class="v" id="kpiAsistentes">—</div><div class="l">Total asistentes</div></div>
      <div class="kpi"><div class="v" id="kpiDur">—</div><div class="l">Duración promedio (min)</div></div>
    </div>
    <div class="filters">
      <div class="filter"><label>N° de Grupo Focal</label><select id="fNgf"><option value="">Todas</option></select></div>
      <div class="filter"><label>Distrito Judicial</label><select id="fDistrito"><option value="">Todas</option></select></div>
      <div class="filter"><label>Tipo de actor</label><select id="fActor"><option value="">Todas</option></select></div>
    </div>
    <div class="updated" id="updated"></div>
  </div>

  <div class="cols">
    <!-- ===== Datos generales ===== -->
    <div>
      <div class="section-bar">Datos generales</div>
      <div class="card">
        <h3>Total de actores contactados</h3>
        <div class="canvas-md"><canvas id="barContactados"></canvas></div>
        <div class="notes" id="notaMeta"></div>
      </div>
      <div class="card">
        <h3>Total de contactados según estado de coordinación</h3>
        <div class="canvas-donut"><canvas id="donutEstado"></canvas></div>
        <div class="dlegend" id="legEstado"></div>
      </div>
    </div>

    <!-- ===== Desagregado ===== -->
    <div>
      <div class="section-bar">Desagregado</div>
      <div class="card">
        <h3>Distribución de grupos focales</h3>
        <div class="dlegend" id="legDist"></div>
        <div class="canvas-md"><canvas id="comboDist"></canvas></div>
      </div>
      <div class="card">
        <h3>Asistencia de participantes contactados por fecha</h3>
        <div class="dlegend" id="legAsis"></div>
        <div class="canvas-md"><canvas id="barAsistencia"></canvas></div>
      </div>
    </div>
  </div>

  <div class="notes" id="notaCols"></div>
  <div class="source">FUENTE: APOYO CONSULTORÍA</div>
</div>

<script>
/* ================= Configuración ================= */
const FONT = 'Arial, sans-serif';
Chart.defaults.font.family = FONT;
Chart.register(ChartDataLabels);

// Meta de participantes (línea roja punteada). Pon un número para mostrarla; null = sin línea.
const META_PARTICIPANTES = null;

// Índices de campos (ver meta.campos de data-gf.js)
const F = { ngf: 0, distrito: 1, actor: 2, estado: 3, contactado: 4, confirmado: 5, asistio: 6, asistencia: 7, fecha: 8, dur: 9 };

const EST_ORDEN = ['Sin respuesta', 'Aceptada', 'En coordinación', 'Rechazada', 'Realizada completa'];
const EST_COLOR = {
  'Sin respuesta': '#A6A6A6', 'Aceptada': '#CD4F4F', 'En coordinación': '#E8A7A7',
  'Rechazada': '#6E6E6E', 'Realizada completa': '#216686',
};
const ACTOR_ORDEN = ['Acompañantes', 'Actores locales', 'Funcionarios del Sistema', 'Multilaterales', 'Prensa'];
const C_CONFIRMADOS = '#E8A7A7', C_ASISTENTES = '#CD4F4F', C_CONTACTADOS = '#A6A6A6';

/* ================= Filtros ================= */
const selNgf = document.getElementById('fNgf');
const selDistrito = document.getElementById('fDistrito');
const selActor = document.getElementById('fActor');

function uniq(campo, orden) {
  const vals = [...new Set(DATA_GF.registros.map(r => r[campo]).filter(Boolean))];
  if (orden) vals.sort((a, b) => (orden.indexOf(a) + 1 || 99) - (orden.indexOf(b) + 1 || 99) || a.localeCompare(b));
  else vals.sort((a, b) => a.localeCompare(b));
  return vals;
}
function llenarFiltros() {
  uniq(F.ngf).forEach(v => selNgf.add(new Option(v, v)));
  uniq(F.distrito).forEach(v => selDistrito.add(new Option(v, v)));
  uniq(F.actor, ACTOR_ORDEN).forEach(v => selActor.add(new Option(v, v)));
  [selNgf, selDistrito, selActor].forEach(s => s.addEventListener('change', render));
}
function filtrar() {
  const n = selNgf.value, d = selDistrito.value, a = selActor.value;
  return DATA_GF.registros.filter(r =>
    (!n || r[F.ngf] === n) && (!d || r[F.distrito] === d) && (!a || r[F.actor] === a));
}

/* ================= Utilidades ================= */
const fmt = n => n.toLocaleString('es-PE');
const pct = (n, d) => d > 0 ? Math.round(n / d * 100) + '%' : '0%';
const suma = (rs, c) => rs.reduce((s, r) => s + (r[c] || 0), 0);
const cuenta = (rs, c, v) => rs.filter(r => r[c] === v).length;

/* ================= Gráficos ================= */
let chBar = null, chDonut = null, chCombo = null, chAsis = null;

function actoresOrdenados(regs) {
  const cats = ACTOR_ORDEN.filter(a => regs.some(r => r[F.actor] === a));
  regs.map(r => r[F.actor]).forEach(a => { if (a && !cats.includes(a)) cats.push(a); });
  return cats;
}

function renderBarContactados(regs) {
  const ngfs = [...new Set(regs.map(r => r[F.ngf]).filter(Boolean))].sort();
  const vals = ngfs.map(g => suma(regs.filter(r => r[F.ngf] === g), F.contactado));

  const datasets = [{
    label: 'Contactados', data: vals, backgroundColor: '#A6A6A6', barPercentage: 0.5,
    datalabels: { anchor: 'end', align: 'end', color: '#595959', font: { size: 13, weight: 'bold' }, formatter: v => fmt(v) },
  }];
  if (META_PARTICIPANTES != null) {
    datasets.push({
      label: 'Meta de participantes', type: 'line', data: ngfs.map(() => META_PARTICIPANTES),
      borderColor: '#CD4F4F', borderWidth: 2, borderDash: [6, 4], pointRadius: 0, datalabels: { display: false },
    });
  }
  if (chBar) chBar.destroy();
  chBar = new Chart(document.getElementById('barContactados'), {
    type: 'bar', data: { labels: ngfs, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 22 } },
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: {
        x: { grid: { display: false }, border: { color: '#000', width: 2 }, ticks: { font: { size: 11 } } },
        y: { grid: { display: false }, border: { color: '#000', width: 2 }, beginAtZero: true, grace: '20%', ticks: { precision: 0, font: { size: 9 } } },
      },
    },
  });
  document.getElementById('notaMeta').textContent =
    META_PARTICIPANTES == null ? 'Nota: para mostrar la línea "Meta de participantes", indícame el número objetivo.' : '';
}

function renderDonut(regs) {
  const cats = EST_ORDEN.filter(c => cuenta(regs, F.estado, c) > 0);
  const vals = cats.map(c => cuenta(regs, F.estado, c));
  const cols = cats.map(c => EST_COLOR[c]);
  const total = vals.reduce((a, b) => a + b, 0);
  if (chDonut) chDonut.destroy();
  chDonut = new Chart(document.getElementById('donutEstado'), {
    type: 'doughnut',
    data: { labels: cats, datasets: [{ data: vals, backgroundColor: cols, borderColor: '#fff', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '55%', layout: { padding: 30 },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.parsed)} (${pct(ctx.parsed, total)})` } },
        datalabels: {
          anchor: 'end', align: 'end', offset: 2, clamp: true,
          font: { size: 10, weight: 'bold' }, color: ctx => cols[ctx.dataIndex],
          formatter: v => v > 0 && v / total >= 0.02 ? `${fmt(v)} (${pct(v, total)})` : '',
        },
      },
    },
  });
  document.getElementById('legEstado').innerHTML = cats.map(c =>
    `<div class="item"><span class="swatch" style="background:${EST_COLOR[c]}"></span>${c}</div>`).join('')
    || '<span class="empty">Sin datos</span>';
}

function renderCombo(regs) {
  const cats = actoresOrdenados(regs);
  const conf = cats.map(a => suma(regs.filter(r => r[F.actor] === a), F.confirmado));
  const asis = cats.map(a => suma(regs.filter(r => r[F.actor] === a), F.asistio));
  const cont = cats.map(a => suma(regs.filter(r => r[F.actor] === a), F.contactado));

  if (chCombo) chCombo.destroy();
  chCombo = new Chart(document.getElementById('comboDist'), {
    type: 'bar',
    data: {
      labels: cats,
      datasets: [
        { label: 'Confirmados', data: conf, backgroundColor: C_CONFIRMADOS, barPercentage: 0.7, categoryPercentage: 0.7,
          datalabels: { anchor: 'end', align: 'top', color: C_CONFIRMADOS, font: { size: 10, weight: 'bold' }, formatter: v => v || '' } },
        { label: 'Asistentes', data: asis, backgroundColor: C_ASISTENTES, barPercentage: 0.7, categoryPercentage: 0.7,
          datalabels: { anchor: 'end', align: 'top', color: C_ASISTENTES, font: { size: 10, weight: 'bold' }, formatter: v => v || '' } },
        { label: 'Contactados', type: 'line', data: cont, borderColor: C_CONTACTADOS, borderWidth: 3,
          pointBackgroundColor: '#808080', pointRadius: 4, tension: 0.3,
          datalabels: { anchor: 'end', align: 'top', color: '#595959', font: { size: 10, weight: 'bold' }, formatter: v => v || '' } },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 22 } },
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: {
        x: { grid: { display: false }, border: { color: '#000', width: 2 }, ticks: { font: { size: 9 }, maxRotation: 0, autoSkip: false } },
        y: { display: false, beginAtZero: true, grace: '20%' },
      },
    },
  });
  document.getElementById('legDist').innerHTML =
    `<div class="item"><span class="swatch" style="background:${C_CONFIRMADOS}"></span>Confirmados</div>` +
    `<div class="item"><span class="swatch" style="background:${C_ASISTENTES}"></span>Asistentes</div>` +
    `<div class="item"><span class="swatch" style="background:${C_CONTACTADOS}"></span>Contactados</div>`;
}

function renderAsistencia(regs) {
  const con = regs.filter(r => r[F.fecha]);
  const fechas = [...new Set(con.map(r => r[F.fecha]))].sort();
  const lab = fechas.map(f => new Date(f + 'T00:00:00').toLocaleDateString('es-PE', { day: '2-digit', month: 'short' }));
  const asis = fechas.map(f => con.filter(r => r[F.fecha] === f && r[F.asistencia] === 'Asistió').length);
  const noasis = fechas.map(f => con.filter(r => r[F.fecha] === f && r[F.asistencia] === 'No asistió').length);

  if (chAsis) chAsis.destroy();
  chAsis = new Chart(document.getElementById('barAsistencia'), {
    type: 'bar',
    data: {
      labels: lab,
      datasets: [
        { label: 'Asistió', data: asis, backgroundColor: '#CD4F4F', barPercentage: 0.8, categoryPercentage: 0.6,
          datalabels: { anchor: 'end', align: 'end', color: '#fff', font: { size: 11, weight: 'bold' }, formatter: v => v || '' } },
        { label: 'No asistió', data: noasis, backgroundColor: '#A6A6A6', barPercentage: 0.8, categoryPercentage: 0.6,
          datalabels: { anchor: 'end', align: 'end', color: '#fff', font: { size: 11, weight: 'bold' }, formatter: v => v || '' } },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 16 } },
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: {
        x: { grid: { display: false }, border: { color: '#000', width: 2 }, ticks: { font: { size: 10 }, maxRotation: 0 } },
        y: { display: false, beginAtZero: true, grace: '20%' },
      },
    },
  });
  document.getElementById('legAsis').innerHTML =
    `<div class="item"><span class="swatch" style="background:#CD4F4F"></span>Asistió</div>` +
    `<div class="item"><span class="swatch" style="background:#A6A6A6"></span>No asistió</div>`;
}

/* ================= Render principal ================= */
function render() {
  const regs = filtrar();
  document.getElementById('kpiAsistentes').textContent = fmt(suma(regs, F.asistio));
  const durs = regs.filter(r => r[F.asistio] === 1 && r[F.dur] != null).map(r => r[F.dur]);
  document.getElementById('kpiDur').textContent =
    durs.length ? (durs.reduce((a, b) => a + b, 0) / durs.length).toFixed(1) : '—';

  renderBarContactados(regs);
  renderDonut(regs);
  renderCombo(regs);
  renderAsistencia(regs);
}

document.getElementById('updated').textContent =
  `Datos actualizados: ${DATA_GF.meta.generado} — ${DATA_GF.meta.fuente}`;
const faltan = [];
if (!DATA_GF.meta.tiene_ngf) faltan.push('N° de Grupo Focal');
if (!DATA_GF.meta.tiene_fecha_gf) faltan.push('Fecha de grupo focal');
if (!DATA_GF.meta.tiene_duracion) faltan.push('Duración');
if (faltan.length) document.getElementById('notaCols').textContent =
  'Nota: la base actual no incluye ' + faltan.join(', ') + '. Se usan valores por defecto (N° = "Grupo focal 1", fecha = fecha de contacto, duración = —) hasta cargar la base real.';
llenarFiltros();
render();
</script>
</body>
</html>
