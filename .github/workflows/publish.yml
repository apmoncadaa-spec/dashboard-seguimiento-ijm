name: Validar y publicar dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Paso 4: publicar en GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
